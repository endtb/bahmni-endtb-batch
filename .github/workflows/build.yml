name: Build RPM

on:
  push:
    branches: [master]
    # A version tag (e.g. 2.4.2, matching build.gradle's version) also publishes the jar and the RPM
    # as a GitHub release
    tags: ['*.*.*']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 8

      - name: Check the tag matches the version
        if: startsWith(github.ref, 'refs/tags/')
        run: grep -qx "version = '${GITHUB_REF_NAME}'" build.gradle

      - name: Build RPM
        run: ./gradlew clean buildRpm -PbuildNumber=${{ github.run_number }}

      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes "Built from ${GITHUB_SHA}" \
            "build/libs/bahmni-batch-${GITHUB_REF_NAME}.jar" build/distributions/*.rpm

      # master then holds the next version (the patch number up one), unless it's moved on already
      - name: Bump the version on master
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          git fetch origin master
          git checkout -B master origin/master
          if ! grep -qx "version = '${GITHUB_REF_NAME}'" build.gradle; then
            echo "master's version isn't ${GITHUB_REF_NAME}: not bumping"; exit 0
          fi
          next=$(echo "$GITHUB_REF_NAME" | awk -F. '{ printf "%d.%d.%d", $1, $2, $3 + 1 }')
          sed -i "s/^version = '${GITHUB_REF_NAME}'$/version = '${next}'/" build.gradle
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git commit -am "Next version: ${next}"
          git push origin master
